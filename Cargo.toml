[workspace]
resolver = "2"
members = ["crates/*", "cli", "app/src-tauri", "mcp"]

[workspace.package]
version = "0.3.2"

# Dev builds: basic optimizations for tolerable debug performance
[profile.dev]
opt-level = 1

# External dependencies get full optimization even in dev builds.
# Only recompiles when deps change, so the cost is paid once and cached.
[profile.dev.package."*"]
opt-level = 3

# Release builds: full optimization + fat LTO (CI-only, not for local dev)
[profile.release]
opt-level = 3
lto = "thin"
strip = true


[workspace.lints.rust]
warnings = { level = "warn" }

[workspace.lints.clippy]
all = { level = "warn" }
correctness = { level = "warn" }
suspicious = { level = "warn" }
style = { level = "warn" }
complexity = { level = "warn" }
perf = { level = "warn" }

[workspace.dependencies]
parking_lot = "0.12"
flate2 = { version = "1", features = ["zlib-rs"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32c = "0.6"
criterion = { version = "0.8", default-features = false }
env_logger = "0.11"
filetime = "0.2"
hex = "0.4"
image = { version = "0.25", default-features = false }
log = "0.4"
quick-xml = "0.42"
rayon = "1.12"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
zerocopy = { version = "0.8", features = ["derive"] }
structured-zstd = "0.2"

# Workspace crates
starbreaker-3d = { path = "crates/starbreaker-3d" }
starbreaker-blend = { path = "crates/starbreaker-blend" }
starbreaker-chf = { path = "crates/starbreaker-chf" }
starbreaker-chunks = { path = "crates/starbreaker-chunks" }
starbreaker-common = { path = "crates/starbreaker-common" }
starbreaker-cryxml = { path = "crates/starbreaker-cryxml" }
starbreaker-datacore = { path = "crates/starbreaker-datacore" }
starbreaker-dds = { path = "crates/starbreaker-dds" }
starbreaker-dna = { path = "crates/starbreaker-dna" }
starbreaker-gfx = { path = "crates/starbreaker-gfx" }
starbreaker-p4k = { path = "crates/starbreaker-p4k" }
starbreaker-ui = { path = "crates/starbreaker-ui" }
starbreaker-wem = { path = "crates/starbreaker-wem" }
starbreaker-wwise = { path = "crates/starbreaker-wwise" }
