[package]
name = "starbreaker"
version.workspace = true
edition = "2024"

[[bin]]
name = "starbreaker"
path = "src/main.rs"

[dependencies]
starbreaker-wwise = { workspace = true }
starbreaker-wem = { workspace = true }
starbreaker-chunks = { workspace = true }
starbreaker-chf = { workspace = true }
starbreaker-p4k = { workspace = true }
starbreaker-datacore = { workspace = true }
starbreaker-3d = { workspace = true }
starbreaker-common = { workspace = true }
starbreaker-blend = { workspace = true }
starbreaker-cryxml = { workspace = true }
starbreaker-dds = { workspace = true }
starbreaker-gfx = { workspace = true }

clap = { workspace = true }
thiserror = { workspace = true }
indicatif = "0.18"
regex = "1"
glob-match = "0.2"
rayon = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
image = { workspace = true, features = ["png"] }
serde_json = { workspace = true }
parking_lot = { workspace = true }
filetime = { workspace = true }

# Dev-dependencies used only by examples (not shipped in the release binary).
[dev-dependencies]
crc32c = { workspace = true }
anyhow = { workspace = true }
