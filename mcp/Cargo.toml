[package]
name = "starbreaker-mcp"
version.workspace = true
edition = "2021"

[[bin]]
name = "starbreaker-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
tokio = { workspace = true, features = ["rt", "macros", "io-std"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
base64 = "0.23"
anyhow = { workspace = true }

image = { workspace = true, features = ["png", "jpeg", "tiff", "gif", "bmp", "tga"] }
structured-zstd = { workspace = true }

starbreaker-p4k = { workspace = true }
starbreaker-datacore = { workspace = true }
starbreaker-cryxml = { workspace = true }
starbreaker-common = { workspace = true }
starbreaker-chunks = { workspace = true }
starbreaker-dds = { workspace = true }
starbreaker-3d = { workspace = true }
starbreaker-ui = { workspace = true }
