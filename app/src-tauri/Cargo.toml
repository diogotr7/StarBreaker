[package]
name = "starbreaker-app"
version.workspace = true
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.5"
tauri-plugin-dialog = "2.8"
serde = { workspace = true }
serde_json = { workspace = true }
starbreaker-p4k = { workspace = true }
starbreaker-common = { workspace = true }
starbreaker-datacore = { workspace = true }
starbreaker-3d = { workspace = true }
starbreaker-chf = { workspace = true }
starbreaker-wwise = { workspace = true }
starbreaker-wem = { workspace = true }
starbreaker-cryxml = { workspace = true }
starbreaker-dds = { workspace = true }
image = { workspace = true, features = ["png"] }
tokio = { workspace = true, features = ["rt"] }
rayon = { workspace = true }
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
parking_lot = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
tauri-plugin-log = "2.10"
tauri-plugin-store = "2.5"
system-theme = "0.3"
futures-lite = "2"
filetime = { workspace = true }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
which = "8"
include_dir = "0.7"
