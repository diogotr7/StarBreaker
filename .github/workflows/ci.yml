name: CI

# Per-ref concurrency: a new push to a branch or PR cancels its previous,
# now-stale run (instead of queueing behind it); main pushes don't cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  # Run on every branch push so feature branches get CI without needing an
  # open PR, and main pushes re-warm the `cache-test-*` slot on main's ref
  # scope (which feature branches then inherit from).
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "cli/**"
      - "mcp/**"
      - "app/**"
      - ".github/workflows/ci.yml"
      - "scripts/check_ui_hardcoding.sh"
      - "scripts/lib/**"
  # Triggers for both same-repo and fork PRs targeting main. Fork PRs run
  # with a read-only GITHUB_TOKEN; `swatinem/rust-cache` will read but not
  # save the cache (GitHub restricts cache writes from forks).
  pull_request:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "cli/**"
      - "mcp/**"
      - "app/**"
      - ".github/workflows/ci.yml"
      - "scripts/check_ui_hardcoding.sh"
      - "scripts/lib/**"
  workflow_dispatch:

env:
  # CI builds are throwaway: no incremental state, no debuginfo (the workspace
  # dev profile carries full debuginfo for local debugging, which mostly costs
  # link time here, worst on Windows) and a smaller cache.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    # Platforms per event. Ubuntu is the fast check on every branch push;
    # Windows (where the game and most users are, and the slow job) gates
    # PRs and main:
    #   push to main           -> ubuntu + windows
    #   push to another branch -> ubuntu
    #   PR from this repo      -> windows (its branch push already ran ubuntu)
    #   PR from a fork         -> ubuntu + windows (fork pushes don't run here)
    #   manual dispatch        -> ubuntu + windows
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && '["windows-latest"]')
          || (github.event_name == 'push' && github.ref != 'refs/heads/main' && '["ubuntu-22.04"]')
          || '["windows-latest", "ubuntu-22.04"]') }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Test-only cache — a separate slot from release.yml's `cache-<platform>`.
      # Only main writes the cache; branches restore main's. Saves the
      # post-job upload on every branch push and stops branches from evicting
      # each other under the repo's cache quota.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: cache-test-${{ matrix.platform }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: UI hardcoding guard
        shell: bash
        run: bash scripts/check_ui_hardcoding.sh

      - name: Test workspace
        run: cargo test --workspace --locked
