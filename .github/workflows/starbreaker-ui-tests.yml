name: starbreaker-ui tests

on:
  push:
    paths:
      - crates/starbreaker-ui/**
      - scripts/**
      - .github/workflows/starbreaker-ui-tests.yml
  pull_request:
    paths:
      - crates/starbreaker-ui/**
      - scripts/**
      - .github/workflows/starbreaker-ui-tests.yml

# Same as ci.yml: a new push cancels the stale run, except on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test-starbreaker-ui:
    # Same-repo branches are covered by the push run; pull_request runs only
    # for forks (see ci.yml).
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: UI hardcoding guard
        run: bash scripts/check_ui_hardcoding.sh
      - name: Validate regression manifest and freeze lockfile (quick)
        run: bash scripts/validate_ui_regression_artifacts.sh --quick
      - name: Run repo-only UI regression contract
        run: bash scripts/validate_ui_regression_repo_only.sh
      - name: Run starbreaker-ui library tests
        run: cargo test -p starbreaker-ui --lib
      - name: Run Phase 5 certification dashboard drift check
        run: cargo run -p starbreaker-ui --example phase5_certification_dashboard
