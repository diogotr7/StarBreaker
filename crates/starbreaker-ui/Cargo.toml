[package]
name = "starbreaker-ui"
edition = "2024"
version.workspace = true
description = "Static UI atom extractor and canvas composer for Star Citizen ship screens"

[dependencies]
flate2 = { workspace = true }
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "gif", "bmp", "tga"] }
log = "0.4"
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
starbreaker-dds = { path = "../starbreaker-dds" }
rusttype = "0.9"
swf = "0.3"
thiserror = "2"
# Phase 6: vector rasterisation backend for the canvas compositor.
# tiny-skia is pre-approved; must remain unmodified (read-only dep).
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
usvg = { version = "0.48", default-features = false }
hex = "0.4"

[dev-dependencies]
anyhow = "1"
rayon = "1.12.0"
starbreaker-p4k = { path = "../starbreaker-p4k" }
swf = "0.3"
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }

[lints]
workspace = true
