[package]
name = "starbreaker-p4k"
version.workspace = true
edition = "2024"

[dependencies]
starbreaker-common = { workspace = true }
zerocopy = { workspace = true }
thiserror = { workspace = true }
structured-zstd = { workspace = true }
flate2 = { workspace = true }
aes = "0.9"
cbc = "0.2"
rustc-hash = { workspace = true }
hashbrown = "0.17"
parking_lot = { workspace = true }
rayon = { workspace = true }
smallvec = "1"

[dev-dependencies]
criterion = { workspace = true, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "random_read"
harness = false
