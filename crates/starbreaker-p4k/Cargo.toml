[package]
name = "starbreaker-p4k"
version.workspace = true
edition = "2024"

[dependencies]
starbreaker-common = { path = "../starbreaker-common" }
zerocopy = { version = "0.8", features = ["derive"] }
thiserror = "2"
zstd = "0.14"
flate2 = { workspace = true }
aes = "0.9"
cbc = "0.2"
rustc-hash = "2"
hashbrown = "0.17"
parking_lot = { workspace = true }
rayon = "1"
smallvec = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "random_read"
harness = false
