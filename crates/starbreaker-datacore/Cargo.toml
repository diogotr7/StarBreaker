[package]
name = "starbreaker-datacore"
version.workspace = true
edition = "2024"

[dependencies]
starbreaker-common = { workspace = true }
zerocopy = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }
rayon = { workspace = true }
log = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports", "cargo_bench_support", "plotters", "rayon"] }
starbreaker-p4k = { workspace = true }

[[bench]]
name = "datacore"
harness = false
