[package]
name = "starbreaker-datacore"
version.workspace = true
edition = "2024"

[dependencies]
starbreaker-common = { path = "../starbreaker-common" }
zerocopy = { version = "0.8", features = ["derive"] }
thiserror = "2"
rustc-hash = "2"
serde_json = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
rayon = "1.12"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
starbreaker-p4k = { path = "../starbreaker-p4k" }

[[bench]]
name = "datacore"
harness = false
