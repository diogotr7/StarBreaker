[package]
name = "starbreaker-3d"
version.workspace = true
edition = "2024"

[dependencies]
starbreaker-common = { workspace = true }
starbreaker-chunks = { workspace = true }
starbreaker-dna = { workspace = true }
starbreaker-chf = { workspace = true }
starbreaker-datacore = { workspace = true }
starbreaker-p4k = { workspace = true }
starbreaker-cryxml = { workspace = true }
starbreaker-dds = { workspace = true }
starbreaker-gfx = { workspace = true }
starbreaker-blend = { workspace = true }
starbreaker-ui = { workspace = true }
# glTF reader for `parity` (GLB → summary).
gltf = "1"
gltf-json = { version = "1", features = ["names", "extras", "KHR_lights_punctual", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_emissive_strength", "KHR_materials_volume", "KHR_texture_transform"] }
image = { workspace = true, features = ["png"] }
exr = "1.74"
serde = { workspace = true }
serde_json = { workspace = true }
half = "2"
zerocopy = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
glam = "0.34"
crc32fast = "1.5"
quick-xml = { workspace = true }

[dev-dependencies]
env_logger = { workspace = true }
memmap2 = "0.9"
